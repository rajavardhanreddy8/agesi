# DigitalOcean App Platform Spec
# Deploy via: doctl apps create --spec .do/app.yaml

name: outing-automation

services:
  # Backend (Python Flask + Playwright)
  - name: backend
    github:
      repo: rajavardhanreddy8/agesi
      branch: main
      deploy_on_push: true
    source_dir: form_filler
    dockerfile_path: Dockerfile
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 5000
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: PLAYWRIGHT_BROWSERS_PATH
        scope: RUN_TIME
        value: /opt/playwright
      - key: RENDER_ENVIRONMENT
        scope: RUN_TIME
        value: "true"
      - key: BACKEND_URL
        scope: RUN_TIME
        value: http://localhost:5000
      # Add these manually in DigitalOcean dashboard:
      # JWT_SECRET, ENCRYPTION_KEY, GMAIL_TOKEN_JSON, GROQ_API_KEY

  # Frontend (Static React)
  - name: frontend
    github:
      repo: rajavardhanreddy8/agesi
      branch: main
      deploy_on_push: true
    source_dir: doc_handle
    build_command: npm install && npm run build
    environment_slug: node-js
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: ${backend.PUBLIC_URL}

static_sites:
  - name: frontend
    github:
      repo: rajavardhanreddy8/agesi
      branch: main
    source_dir: doc_handle
    build_command: npm install && npm run build
    output_dir: dist
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: ${backend.PUBLIC_URL}

databases:
  - name: db
    engine: PG
    version: "15"
    size: db-s-dev-database
    num_nodes: 1
