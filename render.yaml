services:
  # Backend Service (Python Flask + Playwright + AP Scheduler)
  - type: web
    name: outing-backend
    env: python
    rootDir: form_filler
    buildCommand: pip install -r requirements.txt && playwright install chromium && playwright install-deps
    startCommand: gunicorn api:app --bind 0.0.0.0:$PORT --workers 2 --timeout 300
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: outing-db
          property: connectionString
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/playwright
      - key: FLASK_APP
        value: api.py
      - key: RENDER_ENVIRONMENT
        value: true
      - key: BACKEND_URL
        value: http://localhost:10000  # Loopback for internal scheduler calls
      # User must add these manually in Dashboard:
      # - JWT_SECRET
      # - ENCRYPTION_KEY
      # - GMAIL_TOKEN_JSON
      # - GROQ_API_KEY
      # - SMTP credentials

  # Frontend Service (React Static Site)
  - type: static
    name: outing-frontend
    env: static
    rootDir: doc_handle
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: outing-backend
          property: url

databases:
  - name: outing-db
    plan: free
    databaseName: outing_automation
    user: postgres
