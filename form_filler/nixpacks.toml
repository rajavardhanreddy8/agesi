# Nixpacks configuration for backend (Python + Playwright)
[phases.setup]
nixPkgs = ["python311", "playwright"]
aptPkgs = ["libnss3", "libatk1.0-0", "libatk-bridge2.0-0", "libcups2", "libdrm2", "libxkbcommon0", "libxcomposite1", "libxdamage1", "libxfixes3", "libxrandr2", "libgbm1", "libasound2"]

[phases.install]
cmds = ["pip install -r requirements.txt", "playwright install chromium"]

[start]
cmd = "gunicorn --bind 0.0.0.0:${PORT:-5000} --workers 2 --timeout 600 api:app"
